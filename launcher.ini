# The Stories Collection launcher - what the menu shows and what it runs.
#
# [launcher]  settings for the menu itself:
#   fullscreen   1 to fill the screen (the default), 0 for a window. F11 swaps at
#                any time; the menu scales to whatever size it is given.
#   music_volume  how loud a card's theme music is, 0 to 1 (0 turns it off)
#   update_repo   the launcher's own repository. The update button in the corner
#                 asks it for its newest release and offers to open the page; a
#                 fork points this at itself, and there is otherwise no reason to
#                 touch it.
#
# One [game:<id>] section per game, in the order you want them on screen
# (first section = leftmost card).
#
#   title     what to print under the card
#   port      git url of the game's source. The launcher fetches it for you, so
#             this is the only address you ever need - see "Where the game comes
#             from" below.
#   port_dir  where to keep that source (default: port/<id>)
#   port_ref  which branch or tag to take (default: main). It is 'release' here:
#             the branch that only moves when a version is cut, so what you build
#             is something that was tested rather than whatever the working branch
#             happened to be that afternoon. The update prompt follows this ref, so
#             a new release is offered on its own.
#   exe       the port's runner. Leave it out and it is the one a build puts in
#             <port_dir>/dist/<platform>/, so there is normally nothing to set.
#   data      passed to the game - its disc image or extracted folder. Also worked
#             out from port_dir when left out.
#   art       box art png. Yours to supply; nothing is shipped (see art/README.txt).
#             Defaults to art/<id>.png, so dropping the file in with the right
#             name needs no edit here.
#   disc      a specific disc, .iso/.bin/.cue/.chd, or an already-extracted folder,
#             skipping the wizard's search. Left out, it looks for optical drives
#             and for disc images in a discs/ folder beside the launcher.
#   music     theme audio, played while this card is highlighted. Also yours to
#             supply (see music/README.txt), and also defaults to music/<id>.mp3.
#   available 0 shows COMING SOON and refuses to launch.
#
# Where the game comes from
# -------------------------
# Nothing but source is downloaded, never a built game: what makes the game is
# your own disc, built on your own machine. That is deliberate - it is why the
# launcher ships no game files, and why the build works on machines an
# already-built binary would refuse to start on.
#
# The launcher fetches the source itself, so downloading this repository is the
# whole download. Sit on a card and press U to fetch or update it; the card says
# where it stands. Then build it, from the folder it was fetched into:
#
#     cd port/vcs && ./build.sh --image /dev/sr0      (or your .iso)
#
# The build needs a C++ toolchain and cmake. When it finishes, the game appears in
# port/vcs/dist/ and this menu will launch it.

[launcher]
fullscreen=1
music_volume=0.6
update_repo=https://github.com/theurbanninja1993-sketch/thestoriescollection-launcher.git

[game:lcs]
title=Grand Theft Auto: Liberty City Stories
# The same source as Vice City Stories: it holds both games.
port=https://github.com/theurbanninja1993-sketch/vcs-recomp.git
port_dir=port/lcs
port_ref=release
art=art/lcs.png
music=music/lcs.mp3
available=1

[game:vcs]
title=Grand Theft Auto: Vice City Stories
port=https://github.com/theurbanninja1993-sketch/vcs-recomp.git
port_dir=port/vcs
port_ref=release
art=art/vcs.png
music=music/vcs.mp3
available=1
