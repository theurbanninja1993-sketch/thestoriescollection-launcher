# ps2x-launcher - what the menu shows and what it runs.
#
# One [game:<id>] section per game, in the order you want them on screen
# (first section = leftmost card).
#
#   title     what to print under the card
#   exe       the port's runner. A relative path resolves beside the launcher, so
#             a release layout can be games/vcs/ps2EntryRunner; absolute works too.
#   data      passed to the game - its disc image or extracted folder.
#   art       box art png. Yours to supply; nothing is shipped (see art/README.txt).
#   available 0 shows COMING SOON and refuses to launch.
#
# The paths below point at this machine's development builds. For a release,
# copy each game into a folder beside the launcher and use relative paths.

[game:lcs]
title=Grand Theft Auto: Liberty City Stories
exe=/mnt/2TBSSD/projects/Liberty City Stories Recomp/build/bin/lcs-recomp
data=/mnt/2TBSSD/projects/Liberty City Stories Recomp/data/game
art=art/lcs.png
available=0

[game:vcs]
title=Grand Theft Auto: Vice City Stories
exe=/mnt/2TBSSD/projects/Vice City Stories Recomp/PS2Recomp/build/ps2xRuntime/ps2EntryRunner
data=/mnt/2TBSSD/projects/Vice City Stories Recomp/iso/extracted/SLUS_215.90
art=art/vcs.png
available=1
